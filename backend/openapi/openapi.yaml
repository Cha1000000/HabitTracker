openapi: 3.1.0
info:
  title: HabitTracker API
  version: 1.0.0
  description: |
    REST API для HabitTracker (Symfony 7 + PostgreSQL + JWT). 
    Форматы времени: epoch millis (Long). Даты — ISO YYYY-MM-DD.
servers:
  - url: https://api.habittracker.com/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    User:
      type: object
      required: [id, name, email, level, points, streak, longestStreak, friendsCount, createdAt, lastActiveAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }
        avatarThumbnailUrl: { type: string, nullable: true }
        level: { type: integer }
        points: { type: integer }
        streak: { type: integer }
        longestStreak: { type: integer }
        friendsCount: { type: integer }
        timezone: { type: string }
        createdAt: { type: integer, format: int64 }
        lastActiveAt: { type: integer, format: int64 }
    Habit:
      type: object
      required: [id, title, description, icon, color, type, frequency, targetValue, unit, createdBy, maxParticipants, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        type: { type: string, enum: [PERSONAL, GROUP] }
        frequency: { type: string, enum: [DAILY, WEEKLY, WEEKDAYS, WEEKENDS, CUSTOM] }
        reminderTime:
          type: object
          nullable: true
          properties:
            hour: { type: integer }
            minute: { type: integer }
        targetValue: { type: integer }
        unit: { type: string }
        createdBy: { type: string, format: uuid }
        participants:
          type: array
          items: { type: string, format: uuid }
        maxParticipants: { type: integer }
        inviteCode: { type: string, nullable: true }
        isPublic: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    HabitEntry:
      type: object
      required: [habitId, userId, date, completed, createdAt, updatedAt]
      properties:
        habitId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        completed: { type: boolean }
        completedAt: { type: integer, format: int64, nullable: true }
        value: { type: integer, default: 1 }
        note: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    FriendRequest:
      type: object
      required: [id, fromUserId, toUserId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        message: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        respondedAt: { type: integer, format: int64, nullable: true }
        updatedAt: { type: integer, format: int64 }
    Friendship:
      type: object
      required: [userId1, userId2, status, requestedBy, requestedAt, updatedAt]
      properties:
        userId1: { type: string, format: uuid }
        userId2: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, BLOCKED, DECLINED] }
        requestedBy: { type: string, format: uuid }
        requestedAt: { type: integer, format: int64 }
        acceptedAt: { type: integer, format: int64, nullable: true }
        blockedBy: { type: string, format: uuid, nullable: true }
        blockedAt: { type: integer, format: int64, nullable: true }
        updatedAt: { type: integer, format: int64 }
    HabitInvitation:
      type: object
      required: [id, habitId, fromUserId, toUserId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        habitId: { type: string, format: uuid }
        habitTitle: { type: string }
        fromUserId: { type: string, format: uuid }
        fromUserName: { type: string }
        toUserId: { type: string, format: uuid }
        message: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED, CANCELLED] }
        createdAt: { type: integer, format: int64 }
        respondedAt: { type: integer, format: int64, nullable: true }
        expiresAt: { type: integer, format: int64, nullable: true }
        updatedAt: { type: integer, format: int64 }
paths:
  /auth/google:
    post:
      summary: Вход по Google ID Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /users/me:
    get:
      summary: Профиль текущего пользователя
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Unauthorized }
  /users/{id}:
    get:
      summary: Профиль пользователя по id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { description: Not found }
  /users/search:
    get:
      summary: Поиск пользователей
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
  /users/me/fcm-tokens:
    put:
      summary: Зарегистрировать FCM токен (идемпотентно)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '204': { description: No Content }
    delete:
      summary: Удалить FCM токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '204': { description: No Content }

  /friend-requests:
    post:
      summary: Создать запрос в друзья
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { toUserId: { type: string }, message: { type: string }, updatedAt: { type: integer, format: int64 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FriendRequest' } } } }
  /friend-requests/incoming:
    get:
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FriendRequest' } } } } }
  /friend-requests/outgoing:
    get:
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FriendRequest' } } } } }
  /friend-requests/{id}/accept:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Friendship' } } } }
  /friend-requests/{id}/decline:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FriendRequest' } } } }
  /friend-requests/{id}:
    delete:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses:
        '204': { description: No Content }
  /friends:
    get:
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Friendship' } } } } }
  /friends/{id}:
    delete:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses: { '204': { description: No Content } }
  /friends/{id}/block:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Friendship' } } } } }
  /friends/{id}/unblock:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Friendship' } } } } }

  /habits:
    post:
      summary: Создать привычку
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } }
    get:
      summary: Привычки пользователя (создал/участник)
      parameters: [ { in: query, name: userId, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Habit' } } } } } }
  /habits/{id}:
    get: { parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } }, '404': { description: Not found } } }
    put: { parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } } }
    patch: { parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } } }
    delete: { parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { '204': { description: No Content } } }
  /habits/{id}/participants:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { userId: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } }
  /habits/{id}/participants/{userId}:
    delete:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } }, { in: path, name: userId, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } }
  /habits/{id}/generate-code:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { inviteCode: { type: string } } } } } } }
  /habits/join:
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { inviteCode: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Habit' } } } } }

  /habit-entries/{habitId}/{userId}/{date}:
    put:
      parameters: [
        { in: path, name: habitId, required: true, schema: { type: string } },
        { in: path, name: userId, required: true, schema: { type: string } },
        { in: path, name: date, required: true, schema: { type: string } }
      ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HabitEntry' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HabitEntry' } } } } }
    get:
      parameters: [
        { in: path, name: habitId, required: true, schema: { type: string } },
        { in: path, name: userId, required: true, schema: { type: string } },
        { in: path, name: date, required: true, schema: { type: string } }
      ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HabitEntry' } } } }, '404': { description: Not found } }
  /habit-entries:
    get:
      parameters:
        - { in: query, name: habitId, required: true, schema: { type: string } }
        - { in: query, name: userId, required: true, schema: { type: string } }
        - { in: query, name: from, required: true, schema: { type: string } }
        - { in: query, name: to, required: true, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HabitEntry' } } } } } }

  /habit-invitations:
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { habitId: { type: string }, toUserId: { type: string }, message: { type: string }, updatedAt: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HabitInvitation' } } } } }
  /habit-invitations/incoming:
    get:
      parameters: [ { in: query, name: userId, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HabitInvitation' } } } } } }
  /habit-invitations/outgoing:
    get:
      parameters: [ { in: query, name: userId, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HabitInvitation' } } } } } }
  /habit-invitations:
    get:
      parameters: [ { in: query, name: habitId, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HabitInvitation' } } } } } }
  /habit-invitations/{id}/accept:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HabitInvitation' } } } } }
  /habit-invitations/{id}/decline:
    post:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HabitInvitation' } } } } }
  /habit-invitations/{id}:
    delete:
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses: { '204': { description: No Content } }

  /notifications/push:
    post:
      summary: Опционально — отправка пушей (если не используете серверные триггеры)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { toUserId: { type: string }, fcmToken: { type: string }, title: { type: string }, body: { type: string }, data: { type: object } } } } } }
      responses: { '202': { description: Accepted } }
