<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Palette: Mint & Navy -->
  <!-- Primary: #10B981, Bg: #0F172A, On: #FFFFFF -->
  <circle cx="512" cy="512" r="472" fill="#0F172A"/>
  <!-- Base ring -->
